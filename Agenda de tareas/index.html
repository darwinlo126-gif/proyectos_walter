<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENA - Todo List Objetos</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4 text-primary">Gestor de Productividad</h2>
                        
                        <form onsubmit="ejecutarAgregar(); return false;" class="mb-4">
                            <div class="mb-3">
                                <label class="form-label">Título de la tarea</label>
                                <input type="text" id="titulo-tarea" class="form-control" placeholder="Ej. Aprender JavaScript" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Prioridad</label>
                                <select id="prioridad-tarea" class="form-select">
                                    <option value="Alta">Alta</option>
                                    <option value="Media" selected>Media</option>
                                    <option value="Baja">Baja</option>
                                </select>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100">Agregar Tarea</button>
                        </form>

                        <hr>

                        <div class="d-flex flex-wrap gap-2 justify-content-center mb-4">
                            <button class="btn btn-outline-secondary btn-sm" onclick="cambiarFiltro('todas')">Todas</button>
                            <button class="btn btn-outline-warning btn-sm" onclick="cambiarFiltro('pendientes')">Pendientes</button>
                            <button class="btn btn-outline-danger btn-sm" onclick="cambiarFiltro('Alta')">Prioridad Alta</button>
                            <button class="btn btn-outline-primary btn-sm" onclick="cambiarFiltro('Media')">Prioridad Media</button>
                            <button class="btn btn-outline-success btn-sm" onclick="cambiarFiltro('Baja')">Prioridad Baja</button>
                        </div>

                        <h5 class="mb-3">Mis Tareas</h5>
                        <ul id="lista-tareas" class="list-group">
                            </ul>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="./procedimiento.js"></script>
</body>
</html>
