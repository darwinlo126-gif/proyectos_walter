<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Poke_api</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./stilo.css" />
  </head>

  <body>
    <div class="container-fluid">
      <!-- genero el titulo de la pagina -->
      <div class="titulo">
        <h1>Busca el Pokemon</h1>
      </div>

      <!-- aca creo la barra de busqueda -->
      <div class="barra">
        <input type="text" id="buscar" placeholder="escriba el pokemon" />
        <button
          type="button"
          class="btn_buscar btn-outline-warning"
          onclick="buscar()"
        >
          Buscar
        </button>
        <button
          type="button"
          class="btn_volver btn-outline-danger"
          id="volver"
          onclick="atras()"
        >
          Atras
        </button>
      </div>

      <!-- contenido -->
      <div class="container mt-4">
        <div id="mensajeError"></div>
        <div id="cargando">Cargando...</div>

        <!-- las tarjetas de los pokemon -->
        <div class="row">
          <div class="col" id="tarjetaspokemon"></div>
        </div>

        <!-- detalles -->
        <div id="detalle"></div>
      </div>
    </div>

    <script src="./proceso.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
