<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/estilo.css" />
  </head>
  <body>
    <div class="calculadora">
      <input
        class="pantalla"
        type="text"
       
        id="resultado"
        readonly="0"
      />
      <!-- el readonly sirve para bloquear el teclado fisico  -->

      <div class="botones">
        <button class="btn" id="numero7" onclick="escribir7()">7</button>
        <button class="btn" id="numero8" onclick="escribir8()">8</button>

        <button class="btn" id="numero9" onclick="escribir9()">9</button>
        <button class="btn1" id="division" onclick="division()">/</button>
        <button class="btn" id="numero4" onclick="escribir4()">4</button>
        <button class="btn" id="numero5" onclick="escribir5()">5</button>
        <button class="btn" id="numero6" onclick="escribir6()">6</button>
        <button class="btn1" id="multiplicacion" onclick="multiplicacion()">
          *
        </button>
        <button class="btn" id="escribir1" onclick="escribir1()">1</button>
        <button class="btn" id="escribir2" onclick="escribir2()">2</button>
        <button class="btn" id="escribir3" onclick="escribir3()">3</button>
        <button class="btn1" id="suma" onclick="suma()">+</button>
        <button class="btn" id="escribir0" onclick="escribir0()">0</button>
        <button class="btn4" id="limpiar" onclick="limpiar()">AC</button>
        <button class="btn5" id="igual" onclick="igual()">=</button>
        <button class="btn1 " id="resta" onclick="resta()" >-</button>
        
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
